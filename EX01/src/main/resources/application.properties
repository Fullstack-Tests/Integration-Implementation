spring.application.name=demo
spring.profiles.active=dev
server.port=8090

# ===== 외부 연계 대상 (둘 중 택1) =====
# (기본) jsonplaceholder — 인증 불필요. 평가/실습에 그대로 사용 가능.
link.api.base=https://jsonplaceholder.typicode.com
# 배치 동기화 주기(ms)
link.sync.delay=60000

# (옵션) 공공데이터포털 OpenAPI 로 교체 가능 — base 를 해당 서비스로 바꾸고 serviceKey 를 사용한다.
#   예) 기상청 단기예보 조회서비스 등
# link.api.base=http://apis.data.go.kr/<서비스경로>
#   ※ serviceKey 등 인증키는 코드에 하드코딩하지 말고 application-dev.properties 로 분리(연계 데이터 보안 NCS 2-3)
